---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit SHA or ref to check out (defaults to github.sha when omitted).
          Lets a caller — release.yml's guard-validated release pipeline — pin
          every job in this reusable workflow to an exact commit instead of a
          mutable tag/branch name, so a workflow_dispatch release can never
          TEST a different commit than the one it builds, signs and publishes (#109).
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate version fields
        run: node scripts/check-versions.js
      - name: Self-test check-minor-bumps.js
        run: node scripts/test-check-minor-bumps.js
      - name: Self-test bump-minor-versions.js
        run: node scripts/test-bump-minor-versions.js
      - name: Self-test publish-marketplace.js
        run: node scripts/test-publish-marketplace.js

  check-shared-modules:
    name: Check Shared Module Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate shared installer modules carry a provenance header
        run: node scripts/check-shared-modules.js
      - name: Validate egress authorization (SSRF class signature)
        run: node scripts/check-egress-authorization.js
      - name: Validate enforced disciplines (documented-but-unenforced class signature)
        run: node scripts/check-enforced-disciplines.js
      - name: Self-test check-enforced-disciplines.js
        run: node scripts/test-check-enforced-disciplines.js
      - name: Validate outbound proxy parity (#196 class signature)
        run: node scripts/check-proxy-parity.js
      - name: Validate documented claims against the code
        run: node scripts/check-docs-claims.js

  build-and-test-task-v1:
    name: Build and Test Packer Task V1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/PackerTask/PackerTaskV1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npx eslint src/
      - name: Compile TypeScript
        run: npm run compile
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # Both task.json files declare a Node20_1 execution handler alongside
      # Node24 so older on-prem/air-gapped agents without the Node 24 runner can
      # still invoke these tasks in production -- but nothing in CI ever ran
      # under Node 20, so a Node-20-incompatible change (e.g. a dependency bump
      # using newer syntax) would ship invisible to exactly the agent population
      # that depends on the fallback (#208). Every step above runs under Node 24
      # (ts-node/mocha need it); this re-points the runner's `node` at 20 and
      # executes the ALREADY-COMPILED src/index.js the Node20_1 handler targets.
      #
      # This is deliberately LOAD-ONLY, not a behavioural gate -- the same
      # decision the sibling azure-pipelines-terraform repo documents and the
      # same one adopted here, not a silent downgrade of it: with no ADO input
      # environment variables present, index.ts's own try/catch converts the
      # resulting "input required" error into a caught
      # tasks.setResult(Failed, ...) and the process exits 0. So the exit code
      # alone is the signal: zero means Node 20 parsed and loaded the whole
      # compiled module graph, non-zero means a real incompatibility surfaced
      # before that catch could run. The full mocha/L0 assertion suite stays
      # Node-24-only; running it twice per task would roughly double CI time,
      # and Node 20 is already EOL -- the handler exists for agents that have
      # not upgraded their runner, not as a second fully-verified path.
      - name: Set up Node 20 for Node20_1 handler smoke test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify compiled output runs under Node 20 (Node20_1 handler)
        run: node src/index.js

  build-and-test-installer-v1:
    name: Build and Test Packer Installer V1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/PackerInstaller/PackerInstallerV1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npx eslint src/
      - name: Compile TypeScript
        run: npm run compile
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # See build-and-test-task-v1's identical step above for the full
      # rationale (#208): this task.json also declares a Node20_1 handler.
      - name: Set up Node 20 for Node20_1 handler smoke test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify compiled output runs under Node 20 (Node20_1 handler)
        run: node src/index.js

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        # Installer script pinned to a commit SHA (not the mutable `v1.7.12`
        # tag, and not `main`) and given an explicit version, so both the
        # fetched script and the resulting binary are deterministic.
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        run: ./actionlint -color

      # ── The one guard that is a shell script inside YAML ───────────────────
      # pr-checks.yml's "Breaking-change footers survive the squash" job is a
      # bash script embedded in a workflow: actionlint above checks its syntax,
      # zizmor below checks the workflow around it, and nothing runs it. In the
      # five estate repos it was ported from it has never had a test, so a regex
      # edit, a lost `set -euo pipefail` or a silently renamed job would leave a
      # green required context asserting nothing (#274). This EXTRACTS the
      # script out of the workflow and runs it against fixture commit histories
      # with `gh` stubbed — here, in the workflow-shaped job, because that is
      # what it is a statement about, and because this context is already
      # required so the proof blocks a merge from the day it lands.
      - name: Self-test the breaking-change footer guard
        run: node scripts/test-breaking-change-footers.js

  zizmor:
    name: Scan Workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Online audits (ref-version-mismatch, impostor-commit, known-vulnerable
      # actions) use GITHUB_TOKEN; the rest (unpinned-uses, template-injection,
      # excessive-permissions) run regardless. Pinned for a deterministic gate.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run --spec zizmor==1.26.1 zizmor .github/workflows/
