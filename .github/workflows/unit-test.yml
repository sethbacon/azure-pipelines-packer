---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit SHA or ref to check out (defaults to github.sha when omitted).
          Lets a caller — release.yml's guard-validated release pipeline — pin
          every job in this reusable workflow to an exact commit instead of a
          mutable tag/branch name, so a workflow_dispatch release can never
          TEST a different commit than the one it builds, signs and publishes (#109).
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # Task versions are compared against the SAME task at the base
          # revision, which needs the base commit to be in the object store. A
          # shallow checkout has only the merge commit, so `git show
          # <base>:Tasks/.../task.json` would fail and check-versions.js fails
          # closed rather than skipping the comparison.
          fetch-depth: 0
      - name: Validate version fields
        env:
          # On a pull_request the checkout is the merge ref and origin/main is
          # not fetched, so name the base explicitly; on a push it is the commit
          # main was at before. check-versions.js falls back to origin/main then
          # HEAD^ and FAILS if none resolves while tasks exist.
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.js
      - name: Validate the .vsix would compose correctly
        # Static: answers "if we composed the package right now, would it be
        # correct?" without building one, so a misclassified file fails the
        # pull request that adds it rather than the release that ships it.
        run: node scripts/check-package-composition.js
      - name: Self-test check-minor-bumps.js
        run: node scripts/test-check-minor-bumps.js
      - name: Self-test bump-minor-versions.js
        run: node scripts/test-bump-minor-versions.js
      # NO `Self-test check-proxy-parity.js` STEP HERE ANY MORE, and the absence
      # is deliberate rather than an omission. That gate has been wrong twice --
      # once reporting no call sites for a task that makes them, once
      # attributing a locally defined function to a package by name alone. Both
      # changed the inventory silently, which is the one failure a coverage gate
      # must not have, and it is why the self-test existed. The gate is now the
      # shared `check-proxy-parity` composite action, so its self-test runs in
      # 4cloudguru/shared-workflows' own CI, beside the script it exercises and
      # against the bytes every consumer actually calls -- one place instead of
      # three hand-copies.

  check-shared-modules:
    name: Check Shared Module Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate shared installer modules carry a provenance header
        run: node scripts/check-shared-modules.js
      # The gate itself now lives in 4cloudguru/shared-workflows as a composite
      # action, not as a hand-copy under scripts/. A composite is a STEP inside
      # this job, so `Check Shared Module Provenance` keeps its name and stays
      # the required status context it already is -- a reusable workflow would
      # have reported as `<job-id> / <called-job-name>` and renamed the check.
      # The action's own self-test runs in shared-workflows' CI beside the
      # script, which is why no `Self-test` step follows this one any more.
      - name: Shared-module pins in lockstep (#1108 class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/check-shared-module-pins@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-11: node .github/actions/check-shared-module-pins/check-shared-module-pins.js . --json
          #             -> scanned 2
          min-scanned: 2
      # The five class gates below are the same move as the pins gate above: the
      # shared composite replaces the hand-copied gate script this repository
      # used to carry under scripts/, and each one's self-test now runs in
      # shared-workflows' CI rather than here. The composites also export their
      # own `github.action_path`, which is how the task L0 suites that SPAWN
      # these gates find the exact bytes the pin names -- see the two Build and
      # Test jobs below.
      #
      # check-egress-authorization is the last of them to move (it was
      # `scripts/check-egress-authorization.js` here until v1.28.0) and the
      # only one whose three hand-copies disagreed: what ships in the composite
      # is the UNION that landed in all three extensions first, so this
      # repository's verdicts are unchanged -- the script deleted here was
      # byte-identical to the action's (sha256 e1a8d4fe...).
      #
      # Every floor in this job is a MEASURED value, not a guess: the gate exits
      # 0 over a repository it enumerated nothing in, so a floor is what tells
      # "looked and found none" apart from "looked nowhere". A legitimate move
      # in the count is a one-line edit in the same PR that moved it.
      - name: Validate egress authorization (#161/#188/#191/#200/#201 class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/check-egress-authorization@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-11: node .github/actions/check-egress-authorization/check-egress-authorization.js . --json
          #             -> sites 8
          min-sites: 8
      - name: Validate enforced disciplines (documented-but-unenforced class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/check-enforced-disciplines@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
      - name: Validate outbound proxy parity (#196 class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/check-proxy-parity@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-10: node .github/actions/check-proxy-parity/check-proxy-parity.js . --json -> sites 6
          min-sites: 6
      - name: Validate artifact trust (#65/#78/#136/#198/#204 class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/check-artifact-trust@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-10: node .github/actions/check-artifact-trust/check-artifact-trust.js . --json
          #             -> sites 19, scanned 23
          min-scanned: 23
          min-sites: 19
      - name: Validate provider auth parity (#97/#187/#194/#199/#44/#197 class signature)
        uses: 4cloudguru/shared-workflows/.github/actions/auth-parity-matrix@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-10: node .github/actions/auth-parity-matrix/auth-parity-matrix.cjs . --json
          #             -> cells 70, scanned 23
          min-scanned: 23
          min-cells: 70
      - name: Validate documented claims against the code
        uses: 4cloudguru/shared-workflows/.github/actions/check-docs-claims@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          # 2026-09-11: node .github/actions/check-docs-claims/check-docs-claims.js . --json
          #             -> claims 59 (the sum of the `enumerated` counters)
          min-claims: 59
      # The root package.json's devDependencies (tfx-cli, @cyclonedx/cyclonedx-npm,
      # rimraf, typescript) are installed here and by release.yml's build/package/
      # sbom-and-sign/publish-marketplace jobs -- unlike a typical devDependency,
      # tfx-cli ships bundled into the signed .vsix, so this is not omit-able the
      # way the per-task audits omit dev (#335): everything at root IS what ships.
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Audit root build/publish toolchain
        run: npm audit --audit-level=high
      # Provenance, not just integrity (#414). The audit above and `npm ci`'s
      # lockfile hashes answer "are these the bytes the lockfile pinned"; this
      # answers "were those bytes published by the build that claims to have
      # built them". Both @4cloudguru/pipeline-task-* packages publish SLSA
      # provenance attestations, and they carry the delegated GPG verifier, the
      # OIDC token requester and the UPST exchange -- so a registry-side swap is
      # exactly the event worth catching here.
      #
      # Wired as a hard gate rather than advisory: every package in these trees
      # is signed today (verified, including one published in 2016 -- npm
      # back-signed the registry), so there is no permanently-red-because-
      # unsigned failure mode to absorb. It goes red on an INVALID signature,
      # which is the event we want it to go red on.
      - name: Verify registry signatures and provenance (root)
        run: npm audit signatures

  build-and-test-task-v1:
    name: Build and Test Packer Task V1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/PackerTask/PackerTaskV1
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default. Verified rather than assumed for this repo -- the only
        # dependency declaring one is libxmljs2 (a native module under tfx-cli), and
        # both `tfx extension create` and the marketplace publish work without it.
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # See the root job's note (#414): provenance, not just integrity. No
      # --omit=dev here -- signature verification is about who published the
      # bytes on disk, and `npm ci` installed the dev tree too.
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Lint
        run: npx eslint src/
      # THE TWO STEPS BELOW ARE WHAT LETS `npm test` FIND ITS CLASS GATES.
      # Tests/ProxyParityL0.ts and Tests/CredentialFailClosedMatrixL0.ts SPAWN a
      # gate and assert its whole enumerated set. This repository no longer
      # carries those gates -- they are composite actions in
      # 4cloudguru/shared-workflows -- so each composite writes its own
      # `github.action_path` into $GITHUB_ENV (SHARED_GATE_CHECK_PROXY_PARITY,
      # SHARED_GATE_AUTH_PARITY_MATRIX) and Tests/shared-gate.ts reads it. The
      # runner materialises the action tree at the SHA on the `uses:` line, so
      # the bytes the suite spawns are the bytes this pin names -- by
      # construction, not by convention. Remove either step and the suite THROWS
      # on both operating systems naming the line to put back; it can never
      # silently skip.
      #
      # `root:` is passed explicitly because this job sets
      # `defaults.run.working-directory` and a composite action's own steps do
      # NOT inherit it -- without it each gate would analyse the task directory
      # instead of the repository.
      - name: Provide the outbound proxy parity gate to the L0 suite
        uses: 4cloudguru/shared-workflows/.github/actions/check-proxy-parity@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          root: ${{ github.workspace }}
          # 2026-09-10: node .github/actions/check-proxy-parity/check-proxy-parity.js . --json -> sites 6
          min-sites: 6
      - name: Provide the provider auth parity gate to the L0 suite
        uses: 4cloudguru/shared-workflows/.github/actions/auth-parity-matrix@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          root: ${{ github.workspace }}
          # 2026-09-10: node .github/actions/auth-parity-matrix/auth-parity-matrix.cjs . --json
          #             -> cells 70, scanned 23
          min-scanned: 23
          min-cells: 70
      - name: Compile TypeScript
        run: npm run compile
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # Both task.json files declare a Node20_1 execution handler alongside
      # Node24 so older on-prem/air-gapped agents without the Node 24 runner can
      # still invoke these tasks in production -- but nothing in CI ever ran
      # under Node 20, so a Node-20-incompatible change (e.g. a dependency bump
      # using newer syntax) would ship invisible to exactly the agent population
      # that depends on the fallback (#208). Every step above runs under Node 24
      # (ts-node/mocha need it); this re-points the runner's `node` at 20 and
      # executes the ALREADY-COMPILED src/index.js the Node20_1 handler targets.
      #
      # This is deliberately LOAD-ONLY, not a behavioural gate -- the same
      # decision the sibling azure-pipelines-terraform repo documents and the
      # same one adopted here, not a silent downgrade of it: with no ADO input
      # environment variables present, index.ts's own try/catch converts the
      # resulting "input required" error into a caught
      # tasks.setResult(Failed, ...) and the process exits 0. So the exit code
      # alone is the signal: zero means Node 20 parsed and loaded the whole
      # compiled module graph, non-zero means a real incompatibility surfaced
      # before that catch could run. The full mocha/L0 assertion suite stays
      # Node-24-only; running it twice per task would roughly double CI time,
      # and Node 20 is already EOL -- the handler exists for agents that have
      # not upgraded their runner, not as a second fully-verified path.
      - name: Set up Node 20 for Node20_1 handler smoke test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify compiled output runs under Node 20 (Node20_1 handler)
        run: node src/index.js

  build-and-test-installer-v1:
    name: Build and Test Packer Installer V1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/PackerInstaller/PackerInstallerV1
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default. Verified rather than assumed for this repo -- the only
        # dependency declaring one is libxmljs2 (a native module under tfx-cli), and
        # both `tfx extension create` and the marketplace publish work without it.
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # See the root job's note (#414): provenance, not just integrity. No
      # --omit=dev here -- signature verification is about who published the
      # bytes on disk, and `npm ci` installed the dev tree too.
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Lint
        run: npx eslint src/
      # As in build-and-test-task-v1 above: Tests/ArtifactTrustL0.ts SPAWNS this
      # gate and asserts its whole enumerated set. The composite writes its own
      # `github.action_path` into $GITHUB_ENV as SHARED_GATE_CHECK_ARTIFACT_TRUST
      # and Tests/shared-gate.ts reads it, so the bytes the suite spawns are the
      # bytes this pin names. `root:` is explicit because a composite action's
      # steps do not inherit this job's `defaults.run.working-directory`.
      - name: Provide the artifact trust gate to the L0 suite
        uses: 4cloudguru/shared-workflows/.github/actions/check-artifact-trust@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          root: ${{ github.workspace }}
          # 2026-09-10: node .github/actions/check-artifact-trust/check-artifact-trust.js . --json
          #             -> sites 19, scanned 23
          min-scanned: 23
          min-sites: 19
      # Same again for Tests/EgressAuthorizationL0.ts, whose table C SPAWNS the
      # egress gate and asserts its whole enumerated set. Until v1.28.0 that
      # suite ran `scripts/check-egress-authorization.js` from the checkout;
      # now the composite writes SHARED_GATE_CHECK_EGRESS_AUTHORIZATION into
      # $GITHUB_ENV and Tests/shared-gate.ts reads it, so the bytes the suite
      # spawns are the bytes this pin names. `root:` is explicit for the same
      # reason as above.
      - name: Provide the egress authorization gate to the L0 suite
        uses: 4cloudguru/shared-workflows/.github/actions/check-egress-authorization@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
        with:
          root: ${{ github.workspace }}
          # 2026-09-11: node .github/actions/check-egress-authorization/check-egress-authorization.js . --json
          #             -> sites 8
          min-sites: 8
      - name: Compile TypeScript
        run: npm run compile
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # See build-and-test-task-v1's identical step above for the full
      # rationale (#208): this task.json also declares a Node20_1 handler.
      - name: Set up Node 20 for Node20_1 handler smoke test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Verify compiled output runs under Node 20 (Node20_1 handler)
        run: node src/index.js
      # This task's entire security value is verifying a downloaded binary
      # (GPG signature over SHA256SUMS via gpg-verifier.ts) -- the load-only
      # smoke check above only proves the compiled module graph parses under
      # Node 20, since with no ADO inputs supplied the task's own try/catch
      # short-circuits into a caught failure before any of that verification
      # logic runs. Mirroring the sibling azure-pipelines-terraform repo's
      # identical step for its own verifying installers (#720): run the
      # real, input-populated mocha suite under Node 20 too, closing the
      # behavioral-parity gap for a task whose whole job is supply-chain
      # trust (#654). build-and-test-task-v1 above stays load-only -- it has
      # no verification module.

  # Both linters come from the shared definition rather than being maintained
  # here, which upgrades two things at once. The local actionlint install piped
  # curl into bash with no integrity check; the shared one verifies the release
  # asset against actionlint's published SHA256 first. And the local zizmor was
  # pinned to 1.26.1 by version string only, three minor versions behind the
  # scanner the siblings run.
  #
  # The local pair also scanned `.github/workflows/` only, so zizmor's
  # dependabot-cooldown audit never saw dependabot.yml and reported nothing --
  # not because there was nothing to report. The shared job scans the repository.
  workflow-security:
    name: Workflow Security
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0
    with:
      # release.yml calls this workflow at the commit it is about to publish;
      # the linters have to read that commit, not the run's default.
      ref: ${{ inputs.ref || github.sha }}

  # Recorded ALONGSIDE the gate above, never instead of it. workflow-security.yml
  # runs zizmor with advanced-security: false, where its exit code stands and a
  # finding fails the job; this one runs the same scanner with sarif, where zizmor
  # EXITS 0 WHATEVER IT FINDS and the job's purpose is to upload. Together:
  # findings block the pull request AND persist in the security tab, where one can
  # be dismissed with a reason that outlives the run. Before this, findings here
  # blocked and left no record (4cloudguru/shared-workflows#25).
  #
  # The permission is granted at this `uses:` site because that is the only place
  # it can be: a called workflow cannot raise its own ceiling. Every caller of THIS
  # file must grant it too -- see release.yml and weekly-security.yml -- because a
  # job requesting more than its caller allows is a startup failure that produces
  # NO JOBS, so it cannot fail a required check either. The context simply never
  # appears, which is indistinguishable from one still running
  # (4cloudguru/shared-workflows#19).
  workflow-security-record:
    name: Workflow Security Record
    permissions:
      contents: read
      security-events: write
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security-record.yml@c52ee27a03d06eee94e13c7bb56385d4edfb94d4 # v1.28.0

