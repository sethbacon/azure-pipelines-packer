---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check tag reachable from main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main 2>/dev/null; then
            echo "Tag ${TAG} is not reachable from origin/main. Releases must be tagged on main." >&2
            exit 1
          fi
      - name: Verify extension version matches tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          EXT_VERSION=$(node -p "require('./azure-devops-extension.json').version")
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match azure-devops-extension.json version (${EXT_VERSION}). Merge the release-please PR before tagging."
            exit 1
          fi
      - name: Verify per-task Minor bumps
        run: |
          # Fail the release if any task's src/ or task.json changed since the previous
          # release tag without its Minor being bumped: ADO agents cache tasks by
          # Major.Minor, so an un-bumped fix would ship to the Marketplace but never
          # reach running agents (#192). Layer 3 of 3 -- release-pr-minor-bumps.yml
          # applies the bumps and pr-checks.yml gates the merge; this is the last
          # line, and the only one an admin merge cannot bypass.
          node scripts/check-minor-bumps.js
      - name: Resolve validated commit SHA
        id: resolve-sha
        # Every downstream job checks out this exact commit rather than
        # re-resolving the tag/ref name. A workflow_dispatch run used to check out
        # the DISPATCHED ref in each job while the guard validated only the input
        # TAG, so a dispatch from main with post-tag commits could build, sign,
        # attest and draft-release a commit that was not the tag (#109). Pinning
        # the SHA here also closes the tag-move race for a tag-triggered run.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI (build + test)
    needs: guard
    uses: ./.github/workflows/unit-test.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  build:
    name: Build release bundle
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install root dependencies
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default. Verified rather than assumed for this repo -- the only
        # dependency declaring one is libxmljs2 (a native module under tfx-cli), and
        # both `tfx extension create` and the marketplace publish work without it.
        run: npm ci --ignore-scripts
      - name: Build release
        run: npm run build:release
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build/
          retention-days: 1

  package:
    name: Package extension (.vsix)
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install root dependencies
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default. Verified rather than assumed for this repo -- the only
        # dependency declaring one is libxmljs2 (a native module under tfx-cli), and
        # both `tfx extension create` and the marketplace publish work without it.
        run: npm ci --ignore-scripts
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: build/
      - name: Package extension
        run: npm run package:release
      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 7

  sbom-and-sign:
    name: Generate SBOM and sign VSIX
    needs: [guard, package]
    permissions:
      contents: read
      id-token: write
      attestations: write   # required by attest-build-provenance / attest-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # --ignore-scripts: this job holds id-token/attestations:write. tfx-cli and
      # @cyclonedx/cyclonedx-npm are pure-JS and need no lifecycle scripts to run
      # (verified); skipping scripts denies a compromised transitive dependency
      # (e.g. a routine lockfile bump) code execution in this privileged context (#102).
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Generate SBOM for PackerTaskV1
        run: |
          cd Tasks/PackerTask/PackerTaskV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-packer-task-v1.cdx.json --omit dev
      - name: Generate SBOM for PackerInstallerV1
        run: |
          cd Tasks/PackerInstaller/PackerInstallerV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-packer-installer-v1.cdx.json --omit dev
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign VSIX with cosign keyless
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          cosign sign-blob --yes "$VSIX_FILE" --bundle "${VSIX_FILE}.bundle"
      # GitHub-native build provenance + SBOM attestations for the published .vsix.
      # Verifiable with: gh attestation verify <file.vsix> --repo sethbacon/azure-pipelines-packer
      - name: Attest build provenance for VSIX
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.vsix'
      - name: Attest SBOM (PackerTaskV1) for VSIX
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: '*.vsix'
          sbom-path: 'sbom-packer-task-v1.cdx.json'
      - name: Attest SBOM (PackerInstallerV1) for VSIX
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: '*.vsix'
          sbom-path: 'sbom-packer-installer-v1.cdx.json'
      - name: Upload SBOM and signature artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-signatures
          path: |
            sbom-*.cdx.json
            *.vsix.bundle
          retention-days: 7

  draft-release:
    name: Create Draft GitHub Release
    needs: [guard, package, sbom-and-sign]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Download SBOM and signature artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-signatures
      - name: Create draft GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.vsix
            sbom-*.cdx.json
            *.vsix.bundle
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true

  publish-marketplace:
    name: Publish to VS Marketplace
    needs: [guard, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    permissions:
      id-token: write   # GitHub OIDC -> Microsoft Entra federated credential
      contents: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # --ignore-scripts: this job holds id-token:write for the Entra federated
      # credential. tfx-cli is pure-JS and needs no lifecycle scripts to run
      # (verified); skipping scripts denies a compromised transitive dependency
      # code execution alongside the token-minting step below (#102).
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      # Authenticate to Microsoft Entra via GitHub OIDC (federated credential) —
      # no stored secret. The service principal is a member of the 'sethbacon'
      # Marketplace publisher. Replaces the deprecated full-scoped TFX_PAT.
      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZDO_PUBLISH_CLIENT_ID }}
          tenant-id: ${{ vars.AZDO_PUBLISH_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish extension with a Microsoft Entra token
        # scripts/publish-marketplace.js spawns tfx WITHOUT --token (so tfx
        # prompts and reads the token from stdin, keeping it out of
        # /proc/<pid>/cmdline -- #109) and retries a transient upstream failure
        # a bounded number of times (v1.2.7's publish died on a single HTTP 503
        # and left an orphaned draft release). A deterministic rejection is
        # never retried. Its behaviour is gated by
        # scripts/test-publish-marketplace.js in CI.
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource app.
          MARKETPLACE_TOKEN=$(az account get-access-token \
            --tenant "${VARS_AZDO_PUBLISH_TENANT_ID}" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          # Mask the runtime-minted token so it is redacted from any log output.
          echo "::add-mask::$MARKETPLACE_TOKEN"
          export MARKETPLACE_TOKEN
          node scripts/publish-marketplace.js --vsix "$VSIX_FILE"
        env:
          VARS_AZDO_PUBLISH_TENANT_ID: ${{ vars.AZDO_PUBLISH_TENANT_ID }}

  undraft-release:
    name: Undraft GitHub Release
    needs: [draft-release, publish-marketplace]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Undraft the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            });
