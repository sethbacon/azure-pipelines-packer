---
name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    # Raised for the workflow-security-record job inside unit-test.yml. A
    # called workflow's token is capped by its CALLER's, so a permission the
    # caller does not hold is a startup failure with zero jobs rather than a
    # red check (4cloudguru/shared-workflows#19).
    permissions:
      actions: read
      contents: read
      security-events: write
    name: CI
    uses: ./.github/workflows/unit-test.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            .
            --format=table
            --output=osv-results.txt

      # Surface the scan result in the run's Summary tab so a reviewer sees the
      # findings (or a clean result) without opening the step logs. Runs even
      # when the scan step reports vulnerabilities (continue-on-error above).
      - name: Publish OSV results to job summary
        if: always()
        run: |
          {
            echo '## OSV-Scanner Results'
            echo ''
            if [ -s osv-results.txt ]; then
              echo '```'
              cat osv-results.txt
              echo '```'
            else
              echo 'No known vulnerabilities found.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # DISTINGUISH A BROKEN SCANNER FROM A CLEAN ONE (#894).
      #
      # continue-on-error above collapses osv-scanner's exit 1 ("vulnerabilities
      # found") and its error exits -- 127 (general error) and 128 (no packages
      # found) -- into one `outcome == 'failure'`, and GitHub exposes the raw
      # exit code nowhere. So the step below used to file an issue TITLED
      # "vulnerabilities found" for a scanner that had simply stopped working.
      #
      # That is not hypothetical: terraform-state-manager-backend#334 filed
      # exactly that issue, asserting vulnerabilities that did not exist, while
      # seven genuinely reachable advisories stayed invisible. The scanner image
      # ships its own Go toolchain and runs it with GOTOOLCHAIN=local, so it
      # aborts on any module whose `go` directive is newer -- and a broken
      # scanner produced the same green as a clean one for weeks.
      #
      # CHECKED ON THE ARTIFACT, NOT THE EXIT CODE, because the exit code is
      # exactly what is unavailable. A findings table always names at least one
      # advisory; a scanner that aborted names none. That test is independent of
      # the output format and of however "no vulnerabilities found" is worded.
      #
      # This FAILS THE RUN rather than warning. A permanently-red Monday for a
      # broken scanner is the notification; a silently green one is the defect,
      # and the whole point of #894 is that the two were indistinguishable.
      - name: Distinguish a broken scanner from real findings
        id: osv_verdict
        if: steps.osv.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -s osv-results.txt ] && grep -qE '(GHSA|OSV|CVE|GO|PYSEC|RUSTSEC)-[0-9A-Za-z-]+' osv-results.txt; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "findings=false" >> "$GITHUB_OUTPUT"
          echo "::error title=OSV-Scanner did not scan::osv-scanner exited non-zero but its output names no advisory. Exit 1 always carries at least one, so this was a scanner error (127 general error, or 128 no packages found), NOT a clean scan and NOT a finding. Do not file a vulnerabilities-found issue for it -- fix the scanner. See #894."
          {
            echo '## ⚠️ OSV-Scanner did not complete'
            echo ''
            echo 'The scan step exited non-zero but produced no advisory identifiers.'
            echo 'This run tells you **nothing** about whether this repository has'
            echo 'known vulnerabilities.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Create issue on new vulnerabilities
        if: steps.osv.outcome == 'failure' && steps.osv_verdict.outputs.findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Comment on the existing tracking issue instead of filing a new
            // one each Monday -- an unremediated finding otherwise buries any
            // genuinely new one under duplicates. Matched on a stable title
            // PREFIX (the full title also embeds today's date) plus both
            // labels, so only a prior OSV-Scanner issue is ever matched.
            const titlePrefix = 'OSV-Scanner: vulnerabilities found';
            const title = `${titlePrefix} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in npm dependencies. Please review the run summary (or the workflow logs) and update affected packages.',
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            });
            const existing = openIssues.data.find((issue) => issue.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
            }

  # ── HashiCorp GPG key freshness ───────────────────────
  gpg-key-freshness:
    name: Check embedded HashiCorp GPG key is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Tasks/PackerInstaller/PackerInstallerV1
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default. Verified rather than assumed for this repo -- the only
        # dependency declaring one is libxmljs2 (a native module under tfx-cli), and
        # both `tfx extension create` and the marketplace publish work without it.
        run: npm ci --ignore-scripts
      - name: Compile
        run: npm run compile
      - name: Compare embedded key against HashiCorp's published key
        run: node scripts/check-gpg-key-freshness.cjs

  # ── Marketplace environment protection canary ─────────
  verify-marketplace-environment-protection:
    name: Verify marketplace environment protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check required reviewers on the marketplace environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ENVIRONMENT = 'marketplace';
            let env;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: ENVIRONMENT,
              });
              env = response.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`The '${ENVIRONMENT}' GitHub Environment does not exist — publish-marketplace in release.yml references an environment with no protection rules at all.`);
                return;
              }
              // Confirmed against GitHub's REST API docs: reading environment
              // protection rules only requires ordinary repo read access (unlike
              // branch-protection/admin-settings endpoints, which need the
              // `administration` permission -- a scope GITHUB_TOKEN cannot grant
              // at all). A failure here is therefore unexpected; surface it
              // distinctly from a real policy gap so the two aren't confused.
              core.warning(`Could not verify the '${ENVIRONMENT}' environment's protection rules (HTTP ${err.status ?? 'unknown'}): ${err.message}. Verify manually via Settings -> Environments.`);
              return;
            }
            const rules = env.protection_rules ?? [];
            const requiredReviewersRule = rules.find((rule) => rule.type === 'required_reviewers');
            const hasRequiredReviewers = Boolean(requiredReviewersRule && Array.isArray(requiredReviewersRule.reviewers) && requiredReviewersRule.reviewers.length > 0);
            if (!hasRequiredReviewers) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no required-reviewer protection rule configured. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Required reviewers.`
              );
              return;
            }
            const branchPolicy = env.deployment_branch_policy;
            const hasDeploymentBranchPolicy = Boolean(
              branchPolicy && (branchPolicy.protected_branches === true || branchPolicy.custom_branch_policies === true)
            );
            if (!hasDeploymentBranchPolicy) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no deployment branch/ref policy configured, ` +
                `so a marketplace publish could run from an unapproved ref even with reviewer approval. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Deployment branches and tags.`
              );
              return;
            }
            core.info(`OK: '${ENVIRONMENT}' environment has ${requiredReviewersRule.reviewers.length} required reviewer(s) and a deployment branch/ref policy configured.`);

  # ── Stale Dependabot PRs ──────────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  # ── Notify on failure ─────────────────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        ci,
        osv-scan,
        gpg-key-freshness,
        verify-marketplace-environment-protection,
        stale-dependabot,
      ]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
