version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # npm — PackerTaskV1
  - package-ecosystem: "npm"
    directory: "/Tasks/PackerTask/PackerTaskV1"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10

  # npm — PackerInstallerV1
  - package-ecosystem: "npm"
    directory: "/Tasks/PackerInstaller/PackerInstallerV1"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10

  # npm — root (build tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
