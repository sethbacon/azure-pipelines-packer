version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    # codeql-action's init/analyze are separate Dependabot dependencies but are
    # version-locked at runtime, so they have to move in a single PR.
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # npm — PackerTaskV1
  - package-ecosystem: "npm"
    directory: "/Tasks/PackerTask/PackerTaskV1"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    ignore:
      # ts-node (the test transpiler) does not support TypeScript 6 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — PackerInstallerV1
  - package-ecosystem: "npm"
    directory: "/Tasks/PackerInstaller/PackerInstallerV1"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — root (build tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 0.23.2 pinned because >=0.23.3 pulls unmaintained lodash carrying
      # GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh (no patched release).
      - dependency-name: "tfx-cli"
        versions: [">=0.23.3"]

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      commit-message-check:
        patterns:
          - "*"
